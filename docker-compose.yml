version: '3.8'

services:
  mt5-ai-trader:
    build: .
    container_name: mt5_ai_live_agent
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./mt5_config.json:/app/mt5_config.json
      - ./trade_logs:/app/trade_logs
    command: >
      /bin/bash -c "Xvfb :99 -screen 0 1024x768x16 -nolisten tcp &
      sleep 2 &&
      DISPLAY=:99 wine python mt5_live_trader.py --mode DEMO"
